<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đâm Xe 3D</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--pn:rgba(15,23,42,.7);--ac:#f97316;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));background:var(--pn);padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.5}
#rooms{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px}
#rooms button{background:var(--pn);color:var(--fg);border:1px solid #475569;border-radius:8px;padding:6px 9px;font-size:12px}
#rooms button.on{background:var(--ac);border-color:var(--ac)}
.pad{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.pad button{width:64px;height:64px;border-radius:50%;border:2px solid #64748b;background:var(--pn);color:var(--fg);font-size:24px}
.pad button:active{background:var(--ac)}
#msg{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:700;pointer-events:none;text-shadow:0 2px 8px #000}
#edbtn{position:fixed;left:8px;top:calc(110px + env(safe-area-inset-top,0px));background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
#edp{display:none;position:fixed;left:0;right:0;bottom:0;height:58%;background:#fff;z-index:20;border-top:3px solid var(--ac)}
#ed{position:absolute;inset:0 0 52px 0}
#edbar{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;gap:8px;align-items:center;padding:0 10px calc(0px + env(safe-area-inset-bottom,0px));background:#0f172a}
#edbar button{border:0;border-radius:8px;padding:10px 14px;font-weight:600;background:var(--ac);color:#fff}
#edbar span{font-size:11px;opacity:.8;flex:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="rooms"></div>
<div id="msg"></div>
<div class="pad" style="left:12px"><button id="bl">◀</button><button id="br">▶</button></div>
<div class="pad" style="right:12px"><button id="bb">▼</button><button id="bg">▲</button></div>
<button id="edbtn">🧩 Soạn game</button>
<div id="edp"><div id="ed"></div><div id="edbar"><button id="edrun">▶ Chạy thử</button><button id="edx" style="background:#475569">Đóng</button><span>Kéo khối vào sàn rồi bấm Chạy thử</span></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/vi.js"></script>
<script>
let R=14;const CFG={accel:11,grip:.03,bounce:1.5,bots:3,r:14,color:'#f97316'};const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f172a); scene.fog=new THREE.Fog(0x0f172a,30,70);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x334155,.9));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(10,20,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(R,R,1,48),new THREE.MeshLambertMaterial({color:0x475569}));floor.position.y=-.5;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(R,.25,8,64),new THREE.MeshBasicMaterial({color:0xf97316}));ring.rotation.x=Math.PI/2;scene.add(ring);

function mkCar(color){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2.4),new THREE.MeshLambertMaterial({color}));b.position.y=.5;g.add(b);
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,1.1),new THREE.MeshLambertMaterial({color:0xf1f5f9}));c.position.set(0,1.0,-.2);g.add(c);
  const f=new THREE.Mesh(new THREE.BoxGeometry(1.8,.25,.25),new THREE.MeshLambertMaterial({color:0x111827}));f.position.set(0,.4,1.2);g.add(f);
  scene.add(g);return g;
}
const colorOf=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return new THREE.Color().setHSL((h%360)/360,.8,.5)};
const spawn=()=>{const a=Math.random()*6.28;return{x:Math.sin(a)*6,z:Math.cos(a)*6,a:a+3.14}};

function newCar(color){const s=spawn();return{x:s.x,z:s.z,a:s.a,vx:0,vz:0,y:0,fall:0,score:0,hitBy:null,hitT:0,mesh:mkCar(color)}}
const me=newCar(0xf97316);
let bots=[];
function setBots(n){while(bots.length<n)bots.push(Object.assign(newCar(0x94a3b8),{bot:true}));while(bots.length>n){scene.remove(bots.pop().mesh)}}

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const tp={l:0,r:0,g:0,b:0};
[['bl','l'],['br','r'],['bg','g'],['bb','b']].forEach(([id,k])=>{const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();tp[k]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>tp[k]=0))});
const myInput=()=>edOpen?{s:0,g:0}:({s:((keys.arrowleft||keys.a||tp.l)?1:0)-((keys.arrowright||keys.d||tp.r)?1:0),
  g:((keys.arrowup||keys.w||tp.g)?1:0)-((keys.arrowdown||keys.s||tp.b)?.5:0)});

function step(c,inp,dt){
  const ground=Math.hypot(c.x,c.z)<=R;
  if(c.fall>0||!ground&&c.fall===0&&Math.hypot(c.x,c.z)>R+.3){
    if(c.fall===0)c.onFall&&c.onFall();
    c.fall+=dt;c.y-=dt*8;c.x+=c.vx*dt;c.z+=c.vz*dt;
    if(c.fall>1.6)respawn(c);return;
  }
  const sn=Math.sin(c.a),cs=Math.cos(c.a);
  const sp=Math.hypot(c.vx,c.vz);
  c.a+=inp.s*dt*2.8*Math.min(sp/3,1);
  const f=inp.g*CFG.accel;
  c.vx+=Math.sin(c.a)*f*dt;c.vz+=Math.cos(c.a)*f*dt;
  const s2=Math.sin(c.a),c2=Math.cos(c.a);
  let fwd=c.vx*s2+c.vz*c2,lat=c.vx*c2-c.vz*s2;
  fwd*=Math.pow(.4,dt);lat*=Math.pow(CFG.grip,dt);
  c.vx=fwd*s2+lat*c2;c.vz=fwd*c2-lat*s2;
  c.x+=c.vx*dt;c.z+=c.vz*dt;
}
function respawn(c){const s=spawn();Object.assign(c,{x:s.x,z:s.z,a:s.a,vx:0,vz:0,y:0,fall:0,hitBy:null})}

function bump(c,ox,oz,ovx,ovz,id){
  const dx=c.x-ox,dz=c.z-oz,d=Math.hypot(dx,dz);
  if(d>=2||d<.001)return;
  const nx=dx/d,nz=dz/d,ov=2-d;
  c.x+=nx*ov*.5;c.z+=nz*ov*.5;
  const rel=(c.vx-ovx)*nx+(c.vz-ovz)*nz;
  if(rel<0){const j=-1.9*rel/2+CFG.bounce;c.vx+=nx*j;c.vz+=nz*j}
  if(id){c.hitBy=id;c.hitT=performance.now()}
}
function botAI(b,targets){
  let t=null,bd=1e9;for(const o of targets){if(o===b)continue;const d=Math.hypot(o.x-b.x,o.z-b.z);if(d<bd){bd=d;t=o}}
  let tx=t?t.x:0,tz=t?t.z:0;
  if(Math.hypot(b.x,b.z)>R-3.5){tx=0;tz=0}
  let diff=Math.atan2(tx-b.x,tz-b.z)-b.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  return{s:Math.max(-1,Math.min(1,diff*2)),g:.85};
}

// ---- Online ----
// ---- Online ngoài Claude: Firebase Realtime Database (miễn phí) ----
// Dán cấu hình Firebase vào đây (xem hướng dẫn). Để null thì game chạy offline với bot.
const FIREBASE_CONFIG=null;
/* ví dụ: {apiKey:"...",authDomain:"x.firebaseapp.com",databaseURL:"https://x-default-rtdb.firebaseio.com",projectId:"x",appId:"..."} */
const myId='p'+Math.random().toString(36).slice(2,9);
async function fbBase(){
  if(!FIREBASE_CONFIG||!window.firebase)return null;
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();
  return{join:async name=>{
    const pl=db.ref('rooms/'+name+'/players'),mine=pl.child(myId),ko=db.ref('rooms/'+name+'/ko');
    mine.onDisconnect().remove();
    let st={x:0,z:0,a:0,vx:0,vz:0,fl:0,s:0},obj={},hs=[],kh=[],ready=false,lastW=0;
    await mine.set(st);await ko.once('value');ready=true;
    const emitP=()=>{const arr=Object.entries(obj).map(([id,p])=>({peer:id,isMe:id===myId,sameTab:id===myId,kind:'viewer',presence:p}));hs.forEach(h=>h({peers:arr}))};
    const cb=pl.on('value',s=>{obj=s.val()||{};emitP()});
    const kcb=ko.on('child_added',s=>{if(!ready)return;const v=s.val();if(v)kh.forEach(h=>h({data:{to:v.to},isMe:false}))});
    return{name,
      presence:async p=>{st={...st,...p};const n=Date.now();if(n-lastW<70)return;lastW=n;mine.set(st)},
      onPeers:h=>{hs.push(h);emitP();return()=>{hs=hs.filter(x=>x!==h)}},
      on:(t,h)=>{kh.push(h);return()=>{kh=kh.filter(x=>x!==h)}},
      emit:async(t,d)=>{const r=ko.push({to:d.to});setTimeout(()=>r.remove(),5000)},
      leave:async()=>{pl.off('value',cb);ko.off('child_added',kcb);mine.remove()}};
  }};
}
let room=null,myPeer=null,others=[],remote=new Map(),roomName='arena-1',unsubs=[],lastErr='';
const rb=$('rooms');
['1','2','3'].forEach(n=>{const b=document.createElement('button');b.textContent='Phòng '+n;b.onclick=()=>joinRoom('arena-'+n);b.dataset.r='arena-'+n;rb.appendChild(b)});
async function joinRoom(name){
  roomName=name;[...rb.children].forEach(b=>b.classList.toggle('on',b.dataset.r===name));
  unsubs.forEach(u=>u());unsubs=[];if(room&&room.leave)try{await room.leave()}catch(e){}
  room=null;others=[];
  try{
    const base=window.claude?await claude.use('room'):await fbBase();
    if(!base){lastErr=window.claude?'Chưa kết nối online (chơi với bot)':'Offline: chơi với bot (chưa cấu hình Firebase)';return}
    room=await base.join(name);
    unsubs.push(room.onPeers(ch=>{
      const me2=ch.peers.find(p=>p.sameTab);if(me2)myPeer=me2.peer;
      others=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer');
      if(ch.peers.length>5&&me2&&ch.peers.indexOf(me2)>=5){lastErr='Phòng đầy (tối đa 5)';joinRoom(name==='arena-1'?'arena-2':'arena-1')}
      setBots(others.length>=1?0:CFG.bots);
    }));
    unsubs.push(room.on('ko',m=>{if(m.data&&m.data.to===myPeer&&!m.isMe){me.score++;flash('Bạn hất văng 1 xe! +1')}}));
    lastErr='';
  }catch(e){lastErr='Online lỗi: '+(e.code||e.message)}
}
let msgT=0;function flash(t){$('msg').textContent=t;msgT=performance.now()+1500}

me.onFall=()=>{
  flash('Bạn rơi khỏi sàn!');
  if(me.hitBy&&performance.now()-me.hitT<4000&&room)room.emit('ko',{to:me.hitBy}).catch(()=>{});
};
setBots(CFG.bots);joinRoom(roomName);

let last=performance.now(),tick=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;tick++;
  step(me,myInput(),dt);
  const real=others.map(p=>p.presence).filter(p=>p&&typeof p.x==='number'&&!p.fl);
  if(me.fall===0){
    real.forEach((p,i)=>bump(me,p.x,p.z,p.vx||0,p.vz||0,others[i]&&others[i].peer));
    bots.forEach(b=>bump(me,b.x,b.z,b.vx,b.vz,null));
  }
  const all=[me,...bots];
  bots.forEach(b=>{
    if(b.fall===0){real.forEach(p=>bump(b,p.x,p.z,p.vx||0,p.vz||0,null));
      all.forEach(o=>{if(o!==b)bump(b,o.x,o.z,o.vx,o.vz,null)})}
    step(b,botAI(b,[me,...real.map(p=>({x:p.x,z:p.z}))]),dt);
  });
  if(room&&tick%2===0)room.presence({x:+me.x.toFixed(2),z:+me.z.toFixed(2),a:+me.a.toFixed(2),vx:+me.vx.toFixed(2),vz:+me.vz.toFixed(2),fl:me.fall>0?1:0,s:me.score,c:myPeer||'x'}).catch(()=>{});
  // render
  [me,...bots].forEach(c=>{c.mesh.position.set(c.x,c.y,c.z);c.mesh.rotation.y=c.a});
  const seen=new Set();
  others.forEach(p=>{const pr=p.presence;if(!pr||typeof pr.x!=='number')return;seen.add(p.peer);
    let m=remote.get(p.peer);if(!m){m=mkCar(colorOf(p.peer));m.position.set(pr.x,0,pr.z);remote.set(p.peer,m)}
    m.position.x+=(pr.x-m.position.x)*.35;m.position.z+=(pr.z-m.position.z)*.35;
    m.position.y=pr.fl?Math.max(m.position.y-dt*8,-10):0;m.rotation.y=pr.a});
  for(const [k,m] of remote)if(!seen.has(k)){scene.remove(m);remote.delete(k)}
  const tx=me.x-Math.sin(me.a)*9,tz=me.z-Math.cos(me.a)*9;
  cam.position.x+=(tx-cam.position.x)*.08;cam.position.z+=(tz-cam.position.z)*.08;cam.position.y=7;
  cam.lookAt(me.x,0,me.z);
  if(now>msgT)$('msg').textContent='';
  const n=others.length+1;
  $('hud').innerHTML='Điểm: <b>'+me.score+'</b><br>'+(room?('Online · '+roomName+' · '+n+'/5 người'):(lastErr||'Đang kết nối…'))+'<br>'+(bots.length?'Bot: '+bots.length:'')+'<br><span style="opacity:.7">WASD / mũi tên · hất xe khác ra khỏi sàn</span>';
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);

// ---- Soạn game bằng Blockly (chỉ sinh cấu hình JSON, không chạy code tự do) ----
let edOpen=false,ws=null;
const BL=[['set_speed','Tốc độ xe %1',4,25,11,'#f97316'],['set_slip','Độ trơn (trôi xe) %1',0,100,5,'#0ea5e9'],['set_bounce','Độ nảy khi đâm %1',0,10,1.5,'#16a34a'],['set_arena','Bán kính sàn %1',6,25,14,'#a855f7'],['set_bots','Số bot %1',0,5,3,'#64748b']];
function applyCfg(c){
  Object.assign(CFG,c);R=CFG.r;
  const k=R/14;floor.scale.set(k,1,k);ring.scale.set(k,k,1);
  me.mesh.children[0].material.color.set(CFG.color);
  setBots(others.length>=1?0:CFG.bots);respawn(me);bots.forEach(respawn);
}
function readCfg(){
  const c={};
  ws.getTopBlocks(true).forEach(t=>{for(let b=t;b;b=b.getNextBlock()){
    const v=b.getFieldValue('V');
    if(b.type==='set_speed')c.accel=+v;
    if(b.type==='set_slip')c.grip=.005+(+v)/100*.5;
    if(b.type==='set_bounce')c.bounce=+v;
    if(b.type==='set_arena')c.r=+v;
    if(b.type==='set_bots')c.bots=Math.round(+v);
    if(b.type==='set_color')c.color=v;
  }});
  return c;
}
function openEd(){
  edOpen=true;$('edp').style.display='block';
  if(!ws){
    Blockly.defineBlocksWithJsonArray(BL.map(([t,m,mn,mx,d,col])=>({type:t,message0:m,args0:[{type:'field_number',name:'V',value:d,min:mn,max:mx}],previousStatement:null,nextStatement:null,colour:col}))
      .concat([{type:'set_color',message0:'Màu xe %1',args0:[{type:'field_colour',name:'V',colour:'#f97316'}],previousStatement:null,nextStatement:null,colour:'#f43f5e'}]));
    ws=Blockly.inject('ed',{toolbox:{kind:'flatToolbox',contents:[...BL.map(b=>({kind:'block',type:b[0]})),{kind:'block',type:'set_color'}]},trashcan:false,zoom:{controls:false,startScale:.9}});
    Blockly.serialization.workspaces.load({blocks:{languageVersion:0,blocks:[{type:'set_speed',x:20,y:20,next:{block:{type:'set_arena'}}}]}},ws);
  }
  Blockly.svgResize(ws);
}
$('edbtn').onclick=openEd;
$('edx').onclick=()=>{edOpen=false;$('edp').style.display='none'};
$('edrun').onclick=()=>{applyCfg(readCfg());edOpen=false;$('edp').style.display='none';flash('Chạy luật mới!')};
</script>
</body>
</html>
