<script>
// Thay cho runtime của claude.ai: phòng online qua WebRTC (PeerJS, miễn phí, không cần server riêng).
// Người đầu tiên vào mã phòng làm "host" chuyển tiếp dữ liệu; những người sau kết nối vào host.
function mkRoom(name){
  const id='ca1-'+name,R={name,hs:[],mine:{},state:{},me:null,host:false,closed:false,peer:null};
  const emit=()=>R.hs.forEach(h=>{try{h({peers:R.peers()})}catch(e){}});
  const conns={};let bcT=0;
  const bc=()=>{if(bcT)return;bcT=setTimeout(()=>{bcT=0;for(const k in conns)try{conns[k].send({t:'s',s:R.state})}catch(e){};emit()},60)};
  const merge=(o,p)=>{o=Object.assign({},o,p);for(const k in o)if(o[k]===null)delete o[k];return o};
  R.peers=()=>Object.keys(R.state).map(k=>({peer:k,isMe:k===R.me,sameTab:k===R.me,presence:R.state[k]}));
  R.onPeers=h=>{R.hs.push(h);return()=>{R.hs=R.hs.filter(x=>x!==h)}};
  R.presence=p=>{
    R.mine=merge(R.mine,p);
    if(R.host){R.state[R.me]=R.mine;bc()}else if(R.hc&&R.hc.open)try{R.hc.send({t:'p',p})}catch(e){}
    return Promise.resolve();
  };
  R.leave=()=>{R.closed=true;try{R.peer.destroy()}catch(e){}return Promise.resolve()};
  const again=ms=>{if(R.closed)return;try{R.peer.destroy()}catch(e){}R.state={};setTimeout(()=>R.begin(),ms)};
  R.begin=()=>new Promise(res=>{
    const p=new Peer(id);R.peer=p;R.host=false;R.hc=null;
    p.on('open',()=>{
      R.host=true;R.me=id;R.state={};R.state[id]=R.mine;
      p.on('connection',c=>{
        c.on('open',()=>{conns[c.peer]=c;R.state[c.peer]={};bc()});
        c.on('data',m=>{if(m&&m.t==='p'&&R.state[c.peer]&&m.p&&typeof m.p==='object'){R.state[c.peer]=merge(R.state[c.peer],m.p);bc()}});
        c.on('close',()=>{delete conns[c.peer];delete R.state[c.peer];bc()});
      });
      emit();res();
    });
    p.on('error',e=>{
      if(e.type!=='unavailable-id'){res();return}
      p.destroy();
      const q=new Peer();R.peer=q;
      q.on('open',mid=>{
        R.me=mid;const c=q.connect(id);R.hc=c;
        c.on('open',()=>{c.send({t:'p',p:R.mine});res()});
        c.on('data',m=>{if(m&&m.t==='s'){R.state=m.s;emit()}});
        c.on('close',()=>again(300+Math.random()*900));
      });
      q.on('error',er=>{if(er.type==='peer-unavailable')again(600);else res()});
    });
  });
  return R;
}
let _ns=null;
const claude={use:async n=>{
  if(n!=='room')return null;
  if(_ns)return _ns;
  const L=mkRoom('lobby');
  await Promise.race([L.begin(),new Promise(r=>setTimeout(r,6000))]);
  L.join=async nm=>{const r=mkRoom(nm);await Promise.race([r.begin(),new Promise(x=>setTimeout(x,8000))]);return r};
  return _ns=L;
}};
</script>
<script>
const $=id=>document.getElementById(id);
const COLORS=[0xef4444,0x3b82f6,0x22c55e,0xf59e0b,0xa855f7,0xec4899,0x14b8a6,0xf97316,0xe5e7eb,0x6b7280];
const ARENA=18, SPEED=8;
$('code').value=Math.random().toString(36).slice(2,6);
try{$('name').value=localStorage.getItem('ca_name')||''}catch(e){}

let room=null, me={name:'',c:0x3b82f6,k:0xf5cd30,p:0x2b3a67,x:0,z:0,y:0,vy:0,gr:true,score:0,got:[],m:'',q:0,f:0,hp:100,a:0,dq:0,kb:'',cd:0,dead:0,lastHit:'',best:0,fin:false,rx:0,ry:0,rz:0};
let peersNow=[], remote={}, coins={}, started=false;
let mode='coin',selMode='coin',course=false,plats=[],arena,seedNum=1,myPeer='';
const gm={},modeName={coin:'🪙 Coin',parkour:'🏃 Parkour',obby:'🧱 Obby',fight:'🥊 Fight'};
let scene,camera,renderer,meMesh,jx=0,jz=0,keys={};

function coinPos(id){let s=(id*7919+13)%233280;const r=()=>{s=(s*9301+49297)%233280;return s/233280};r();r();return[(r()-.5)*2*(ARENA-3),(r()-.5)*2*(ARENA-3)]}

function label(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.font='bold 34px system-ui,sans-serif';g.textAlign='center';g.fillStyle='rgba(0,0,0,.55)';
  g.fillRect(28,6,200,52);g.fillStyle='#fff';g.fillText(text,128,44);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(3,.75,1);sp.position.y=1.9;return sp;
}
// Nhân vật kiểu Roblox R6: đầu, thân, 2 tay, 2 chân (khối hộp)
function faceTex(k){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle=hex(k);g.fillRect(0,0,64,64);g.fillStyle='#111';
  g.fillRect(16,20,8,12);g.fillRect(40,20,8,12);
  g.lineWidth=4;g.strokeStyle='#111';g.beginPath();g.arc(32,34,15,.15*Math.PI,.85*Math.PI);g.stroke();
  return new THREE.CanvasTexture(c);
}
function makePlayer(c,k,p,name){
  const skin=new THREE.MeshStandardMaterial({color:k,roughness:.6});
  const shirt=new THREE.MeshStandardMaterial({color:c,roughness:.6});
  const pants=new THREE.MeshStandardMaterial({color:p,roughness:.6});
  const box=(w,h,d,mat,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.y=y;return m};
  const g=new THREE.Group();
  const faceMat=new THREE.MeshStandardMaterial({map:faceTex(k),roughness:.6});
  const head=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1),[skin,skin,skin,skin,faceMat,skin]);head.position.y=4.55;
  const torso=box(2,2,1,shirt,3);
  const limb=(w,mat,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=box(w,2,1,mat,-1);p.add(m);return p};
  const armL=limb(1,skin,-1.5,4),armR=limb(1,skin,1.5,4),legL=limb(1,pants,-.5,2),legR=limb(1,pants,.5,2);
  g.add(head,torso,armL,armR,legL,legR);
  const lb=label(name||'?');lb.scale.set(6.6,1.65,1);lb.position.y=6.3;g.add(lb);
  g.scale.setScalar(.42);g.userData={armL,armR,legL,legR,ph:0};
  scene.add(g);return g;
}
function animChar(g,dx,dz,moving,dt){
  const u=g.userData;
  if(moving){let d=Math.atan2(dx,dz)-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*14);u.ph+=dt*11}
  const a=moving?Math.sin(u.ph)*.9:0,k=Math.min(1,dt*15);
  u.armL.rotation.x+=(a-u.armL.rotation.x)*k;u.armR.rotation.x+=((u.pt>0?-1.7:-a)-u.armR.rotation.x)*k;if(u.pt>0)u.pt-=dt;
  u.legL.rotation.x+=(-a-u.legL.rotation.x)*k;u.legR.rotation.x+=(a-u.legR.rotation.x)*k;
}

function initScene(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);scene.fog=new THREE.Fog(0x10131a,30,60);
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.6));
  const d=new THREE.DirectionalLight(0xffffff,.8);d.position.set(8,20,10);scene.add(d);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2,ARENA*2),new THREE.MeshStandardMaterial({color:0x242a36}));
  arena=new THREE.Group();scene.add(arena);
  floor.rotation.x=-Math.PI/2;arena.add(floor);
  arena.add(new THREE.GridHelper(ARENA*2,18,0x4a5468,0x343c4c));
  const wm=new THREE.MeshStandardMaterial({color:0x3b82f6,emissive:0x1d4ed8,emissiveIntensity:.5});
  [[0,-ARENA,ARENA*2,.5],[0,ARENA,ARENA*2,.5],[-ARENA,0,.5,ARENA*2],[ARENA,0,.5,ARENA*2]].forEach(([x,z,w,h])=>{
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,1,h),wm);b.position.set(x,.5,z);arena.add(b)});
  arena.visible=(mode==='coin'||mode==='fight');buildCourse();
  meMesh=makePlayer(me.c,me.k,me.p,me.name);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}

// Điều khiển: cần joystick cảm ứng + WASD/mũi tên
function initInput(){
  const st=$('stick'),kn=$('knob');let id=null;
  const move=t=>{const r=st.getBoundingClientRect(),cx=r.left+65,cy=r.top+65;
    let dx=t.clientX-cx,dy=t.clientY-cy;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}
    kn.style.left=45+dx+'px';kn.style.top=45+dy+'px';jx=dx/m;jz=dy/m};
  st.addEventListener('touchstart',e=>{e.preventDefault();id=e.changedTouches[0].identifier;move(e.changedTouches[0])},{passive:false});
  st.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===id)move(t)},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier===id){id=null;jx=jz=0;kn.style.left=kn.style.top='45px'}};
  st.addEventListener('touchend',end);st.addEventListener('touchcancel',end);
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){e.preventDefault();openChat();return}if(e.key==='f'||e.key==='j')punch();keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
  const jb=$('jump');
  jb.addEventListener('pointerdown',e=>{e.preventDefault();if(me.gr)me.vy=10});
  $('punch').addEventListener('pointerdown',e=>{e.preventDefault();punch()});
  addEventListener('keydown',e=>{if(e.key===' '&&e.target.tagName!=='INPUT')e.preventDefault()});
  if(matchMedia('(pointer:fine)').matches){st.style.display='none'}else{st.style.display='block';jb.style.display='block'}
}

// Chat: tin nhắn đi qua presence nên ai trong phòng cũng gửi được
function addLog(name,ci,text){
  const d=document.createElement('div'),b=document.createElement('b');
  b.style.color=hex(ci);b.textContent=name+': ';
  d.append(b,document.createTextNode(text));const L=$('chatlog');L.append(d);
  while(L.children.length>5)L.firstChild.remove();
  setTimeout(()=>d.remove(),15000);
}
function bubble(g,text){
  const u=g.userData;if(u.bub){g.remove(u.bub);clearTimeout(u.bt)}
  const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
  x.font='bold 36px system-ui,sans-serif';
  let t=text;while(t.length>3&&x.measureText(t).width>470)t=t.slice(0,-1);if(t!==text)t+='…';
  x.fillStyle='rgba(255,255,255,.95)';x.beginPath();if(x.roundRect)x.roundRect(6,6,500,72,18);else x.rect(6,6,500,72);x.fill();
  x.fillStyle='#111';x.textAlign='center';x.fillText(t,256,56);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(11,2.06,1);s.position.y=8.2;g.add(s);u.bub=s;
  u.bt=setTimeout(()=>{g.remove(s);if(u.bub===s)u.bub=null},4500);
}
function openChat(){$('chatbar').style.display='flex';$('chatin').focus()}
function closeChat(){$('chatbar').style.display='none';$('chatin').blur()}
function sendChat(){
  const i=$('chatin'),t=i.value.trim().slice(0,80);i.value='';closeChat();if(!t)return;
  me.q++;me.m=t;sendPresence(true);addLog(me.name,me.c,t);bubble(meMesh,t);
}
function initChat(){
  $('chatbtn').style.display='block';
  $('chatbtn').addEventListener('click',openChat);
  $('chatsend').addEventListener('click',sendChat);
  $('chatin').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();if(e.key==='Escape')closeChat()});
}

// ===== Parkour / Obby: màn chơi sinh từ mã phòng (ai cũng thấy giống nhau) =====
function buildCourse(){
  plats=[];course=(mode==='parkour'||mode==='obby');if(!course)return;
  const grp=new THREE.Group();scene.add(grp);
  let s=seedNum%233280||7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  const ob=mode==='obby',N=ob?30:25,sz=ob?4.5:3,gap=ob?2:3;
  plats.push({x:0,y:0,z:0,w:8,d:8});let x=0,y=0,z=0;
  for(let i=1;i<=N;i++){
    z-=plats[i-1].d/2+sz/2+gap+r();
    x=Math.max(-9,Math.min(9,x+(r()-.5)*8));
    y=Math.max(0,y+r()*1.4-.5);
    plats.push({x,y,z,w:sz,d:sz});
  }
  plats.forEach((p,i)=>{
    const col=i===N?0xfacc15:(ob&&i%5===0)?0x22c55e:i===0?0x6b7280:(i%2?0x3b82f6:0x8b5cf6);
    const m=new THREE.Mesh(new THREE.BoxGeometry(p.w,1,p.d),new THREE.MeshStandardMaterial({color:col,roughness:.7}));
    m.position.set(p.x,p.y-.5,p.z);grp.add(m);
  });
  if(ob){const lv=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0xef4444,emissive:0xb91c1c,emissiveIntensity:.8}));lv.rotation.x=-Math.PI/2;lv.position.y=-1.6;grp.add(lv)}
}
function groundAt(x,z,y){
  let h=-Infinity,k=-1;
  for(let i=0;i<plats.length;i++){const p=plats[i];
    if(Math.abs(x-p.x)<p.w/2+.35&&Math.abs(z-p.z)<p.d/2+.35&&p.y<=y+.4&&p.y>h){h=p.y;k=i}}
  return{h,k};
}
function landed(k){
  if(k<=me.best)return;
  me.score+=k-me.best;me.best=k;
  if(mode==='obby'&&k%5===0){me.rx=plats[k].x;me.ry=plats[k].y;me.rz=plats[k].z;addLog('★',0x22c55e,'Checkpoint '+k+'!')}
  if(k===plats.length-1&&!me.fin){me.fin=true;me.score+=5;addLog('★',0xfacc15,'Về đích! +5')}
  sendPresence(true);
}
function respawn(){me.x=me.rx;me.y=me.ry+.5;me.z=me.rz;me.vy=0}

// ===== Fight: mỗi máy tự tính máu của mình khi thấy đối thủ đấm =====
function punch(){
  if(mode!=='fight'||me.dead>0||me.cd>0)return;
  me.a++;me.cd=.4;meMesh.userData.pt=.25;sendPresence(true);
}
function hitCheck(p){
  if(me.dead>0)return;
  const dx=me.x-p.presence.x,dz=me.z-p.presence.z,d=Math.hypot(dx,dz),f=+p.presence.f||0;
  if(d>.01&&d<2.8&&(dx*Math.sin(f)+dz*Math.cos(f))/d>.2&&Math.abs(me.y-(+p.presence.y||0))<1.8){
    me.hp-=20;me.lastHit=p.peer;
    me.x=Math.max(-ARENA+1,Math.min(ARENA-1,me.x+dx/d*2));me.z=Math.max(-ARENA+1,Math.min(ARENA-1,me.z+dz/d*2));
    if(me.hp<=0){me.hp=0;me.dq++;me.kb=me.lastHit;me.dead=2}
    sendPresence(true);
  }
}

let lastSend=0;
function sendPresence(force){
  const n=performance.now();if(!room||(!force&&n-lastSend<80))return;lastSend=n;
  room.presence({n:me.name,c:me.c,k:me.k,p:me.p,f:+me.f.toFixed(2),hp:me.hp,a:me.a,dq:me.dq,kb:me.kb,x:+me.x.toFixed(2),z:+me.z.toFixed(2),y:+me.y.toFixed(2),s:me.score,g:me.got,m:me.m,q:me.q}).catch(()=>{});
}

function collectedSet(){
  const s=new Set(me.got);
  for(const p of peersNow){if(!p.isMe&&p.presence&&Array.isArray(p.presence.g))p.presence.g.forEach(i=>s.add(i))}
  return s;
}

function renderBoard(){
  const mp=peersNow.find(x=>x.isMe&&x.sameTab);if(mp)myPeer=mp.peer;
  const list=[{n:me.name+' (bạn)',c:me.c,s:me.score,hp:me.hp}];
  peersNow.forEach(p=>{if(!p.isMe&&p.presence&&p.presence.n!=null)list.push({n:String(p.presence.n).slice(0,10),c:pc(p.presence.c,0xffffff),s:+p.presence.s||0,hp:p.presence.hp})});
  list.sort((a,b)=>b.s-a.s);
  $('board').innerHTML='';
  list.forEach(p=>{const d=document.createElement('div');const i=document.createElement('i');
    i.style.background=hex(p.c);
    const t=document.createElement('span');t.textContent=p.n+': '+p.s+(mode==='fight'&&p.hp!=null?' ❤'+p.hp:'');d.append(i,t);$('board').append(d)});
  $('info').textContent=(room?modeName[mode]+' '+room.name.replace(/^[a-z]+-/,'')+' · '+list.length+'/5':'Chơi một mình');
}

let prev=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-prev)/1000,.05);prev=now;
  let dx=jx,dz=jz;
  if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
  if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;
  const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}
  const B=course?1e4:ARENA-1;
  me.x=Math.max(-B,Math.min(B,me.x+dx*SPEED*dt));
  me.z=Math.max(-B,Math.min(B,me.z+dz*SPEED*dt));
  if(keys[' ']&&me.gr&&me.dead<=0)me.vy=10;
  me.vy-=26*dt;const py=me.y;me.y+=me.vy*dt;me.gr=false;
  let gh=0,gk=-1;
  if(course){const G=groundAt(me.x,me.z,py);gh=G.h;gk=G.k}
  if(me.vy<=0&&me.y<=gh){me.y=gh;me.vy=0;me.gr=true;if(gk>=0)landed(gk)}
  if(course&&me.y<(mode==='obby'?-1.5:-10))respawn();
  if(me.cd>0)me.cd-=dt;
  if(me.dead>0){me.dead-=dt;if(me.dead<=0){me.hp=100;me.x=(Math.random()-.5)*24;me.z=(Math.random()-.5)*24;sendPresence(true)}}
  meMesh.visible=me.dead<=0;
  meMesh.position.x=me.x;meMesh.position.z=me.z;meMesh.position.y=me.y;
  if(l>.05)me.f=Math.atan2(dx,dz);
  animChar(meMesh,dx,dz,l>.05,dt);

  // Xu vàng sinh theo thời gian, giống nhau ở mọi máy
  const t=Date.now(),slot=Math.floor(t/4000),got=collectedSet(),active=new Set();
  if(mode==='coin')for(let sl=slot-1;sl<=slot;sl++)for(let i=0;i<3;i++)active.add(sl*3+i);
  for(const id of active){
    if(got.has(id))continue;
    if(!coins[id]){const m=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.15,20),new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xca8a04,emissiveIntensity:.6}));
      const [x,z]=coinPos(id);m.position.set(x,.9,z);m.rotation.x=Math.PI/2;scene.add(m);coins[id]=m}
    const c=coins[id];c.rotation.z+=dt*3;
    if(Math.hypot(c.position.x-me.x,c.position.z-me.z)<1.4&&me.y<1.3){
      me.got.push(id);if(me.got.length>40)me.got.shift();me.score++;got.add(id);sendPresence(true)}
  }
  for(const id in coins){if(!active.has(+id)||got.has(+id)){scene.remove(coins[id]);delete coins[id]}}

  // Người chơi khác (nội suy mượt)
  const seen={};
  peersNow.forEach(p=>{
    if(p.isMe||!p.presence||p.presence.x==null)return;seen[p.peer]=1;
    let r=remote[p.peer];
    if(!r){r={q:p.presence.q|0,a:p.presence.a|0,dq:p.presence.dq|0,mesh:makePlayer(pc(p.presence.c,0x3b82f6),pc(p.presence.k,0xf5cd30),pc(p.presence.p,0x2b3a67),String(p.presence.n||'?').slice(0,10))};r.mesh.position.set(p.presence.x,0,p.presence.z);remote[p.peer]=r}
    if((p.presence.q|0)!==r.q){r.q=p.presence.q|0;const tx=String(p.presence.m||'').slice(0,80);if(tx){addLog(String(p.presence.n||'?').slice(0,10),pc(p.presence.c,0xffffff),tx);bubble(r.mesh,tx)}}
    const ex=p.presence.x-r.mesh.position.x,ez=p.presence.z-r.mesh.position.z;
    r.mesh.position.x+=ex*Math.min(1,dt*12);
    r.mesh.position.z+=ez*Math.min(1,dt*12);
    animChar(r.mesh,ex,ez,Math.hypot(ex,ez)>.12,dt);
    r.mesh.position.y+=((+p.presence.y||0)-r.mesh.position.y)*Math.min(1,dt*14);
    if((p.presence.a|0)!==r.a){r.a=p.presence.a|0;r.mesh.userData.pt=.25;if(mode==='fight')hitCheck(p)}
    if((p.presence.dq|0)!==r.dq){r.dq=p.presence.dq|0;if(mode==='fight'&&p.presence.kb===myPeer){me.score++;sendPresence(true)}}
    r.mesh.visible=!(mode==='fight'&&p.presence.hp===0);
  });
  for(const k in remote)if(!seen[k]){scene.remove(remote[k].mesh);delete remote[k]}

  const cf=course?1:.9;camera.position.set(me.x*cf,me.y+10,me.z*cf+7);camera.lookAt(me.x*cf,me.y+.8,me.z*cf);
  sendPresence(false);renderer.render(scene,camera);
}

async function start(){
  me.name=($('name').value.trim()||'Người chơi'+Math.floor(Math.random()*90+10)).slice(0,10);
  try{localStorage.setItem('ca_name',me.name)}catch(e){}
  const code=($('code').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'')||'lobby').slice(0,12);
  mode=selMode;seedNum=[...code].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  $('status').textContent='Đang kết nối...';$('play').disabled=true;
  try{
    const R=await Promise.race([claude.use('room'),new Promise(r=>setTimeout(()=>r(null),6000))]);
    if(R){
      room=await R.join(mode+'-'+code);R.presence({r:code,g:mode,n:me.name}).catch(()=>{});
      await new Promise(r=>setTimeout(r,900));
      if(room.peers().length>5){await room.leave();room=null;R.presence({r:null}).catch(()=>{});showTab('pJoin');$('status').textContent='Phòng đã đủ 5 người, thử mã khác.';$('play').disabled=false;return}
      room.onPeers(c=>{peersNow=c.peers;renderBoard()});
      peersNow=room.peers();
    }
  }catch(e){room=null}
  $('menu').style.display='none';$('hud').style.display='flex';
  if(mode==='fight'){me.x=(Math.random()-.5)*20;me.z=(Math.random()-.5)*20;$('punch').style.display='block'}
  initScene();initInput();initChat();renderBoard();sendPresence(true);
  if(!room)$('info').textContent='Chơi một mình (không kết nối được phòng)';
  started=true;loop();
}
// Menu dưới màn hình: List game / Join / Avatar
function showTab(id){
  ['pList','pJoin','pAva'].forEach(k=>$(k).style.display=k===id?'block':'none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.t)));
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const pc=(v,d)=>Number.isInteger(v)&&v>=0&&v<=0xffffff?v:d;
function drawAvatar(){
  $('pt').style.background=hex(me.c);
  document.querySelectorAll('#prev .a,#prev .h').forEach(e=>e.style.background=hex(me.k));
  document.querySelectorAll('#prev .l').forEach(e=>e.style.background=hex(me.p));
  $('cc').value=hex(me.c);$('ck').value=hex(me.k);$('cp').value=hex(me.p);
}
[['cc','c'],['ck','k'],['cp','p']].forEach(([id,key])=>{
  try{const s=parseInt(localStorage.getItem('ca_'+key));if(pc(s,-1)>=0)me[key]=s}catch(x){}
  $(id).addEventListener('input',e=>{me[key]=parseInt(e.target.value.slice(1),16);try{localStorage.setItem('ca_'+key,me[key])}catch(x){}drawAvatar()});
});
drawAvatar();
function setChip(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===selMode))}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{selMode=c.dataset.m;setChip()}));

// Danh sách phòng: mỗi người đang chơi đánh dấu mã phòng trên sảnh chung
let lobby=null,lobbyPeers=[];
function renderGames(){
  const m={};
  lobbyPeers.forEach(p=>{const r=p.presence&&p.presence.r;if(typeof r==='string'&&/^[a-z0-9]{1,12}$/.test(r)&&modeName[p.presence.g]){gm[r]=p.presence.g;(m[r]=m[r]||[]).push(String(p.presence.n||'?').slice(0,10))}});
  const L=$('games');L.innerHTML='';const keys=Object.keys(m);
  if(!keys.length){const e=document.createElement('p');e.textContent=lobby?'Chưa có phòng nào đang chơi. Vào tab Join để tạo phòng mới.':'Không kết nối được máy chủ phòng.';L.append(e);return}
  keys.forEach(r=>{
    const row=document.createElement('div');row.className='game';
    const t=document.createElement('span');t.textContent=modeName[gm[r]]+' '+r+' · '+m[r].length+'/5 · '+m[r].join(', ');
    const b=document.createElement('button');b.textContent=m[r].length>=5?'Đầy':'Vào';b.disabled=m[r].length>=5;
    b.addEventListener('click',()=>{$('code').value=r;selMode=gm[r];setChip();start()});
    row.append(t,b);L.append(row);
  });
}
(async()=>{
  try{const R=await Promise.race([claude.use('room'),new Promise(r=>setTimeout(()=>r(null),6000))]);
    if(R){lobby=R;R.onPeers(c=>{lobbyPeers=c.peers;renderGames()})}}catch(e){}
  renderGames();
})();
$('play').addEventListener('click',start);
</script>
